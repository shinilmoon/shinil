<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커핑노트 - Cupping Note</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- ☕ 상단 로고 이미지 영역 -->
        <header>
            <img src="images/logo.png" alt="CUPPING NOTE" class="top-logo">
        </header>

        <!-- 🌿 에티오피아 아침 산림 및 원두 감성 슬라이더 -->
        <div class="slider-container">
            <div class="slider-track" id="sliderTrack">
                <div class="slide"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="안개 핀 아침 산림"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80" alt="에티오피아 아침 숲"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=800&q=80" alt="신선한 로스팅 원두"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80" alt="스페셜티 커피 추출"></div>
            </div>
            <!-- 슬라이더 위 감성 문구 -->
            <div class="slider-caption">
                <h2>Fresh Specialty Coffee</h2>
                <p>안개 핀 에티오피아 아침 산림의 신선함을 전합니다.</p>
            </div>
        </div>

        <div class="section-title">✨ 추천 원두 & 굿즈</div>
        <div class="product-list">
            <!-- 상품 카드 1 -->
            <div class="product-card">
                <div class="product-img">Coffee Bean</div>
                <div class="product-info">
                    <div>
                        <div class="product-name">에티오피아 예가체프 G1</div>
                        <div class="product-desc">화사한 꽃향기와 감귤류의 상큼한 산미</div>
                    </div>
                    <div class="product-price">18,000원</div>
                </div>
            </div>
            <!-- 상품 카드 2 -->
            <div class="product-card">
                <div class="product-img">Coffee Bean</div>
                <div class="product-info">
                    <div>
                        <div class="product-name">콜롬비아 수프리모 블렌드</div>
                        <div class="product-desc">묵직한 바디감과 고소한 견과류의 여운</div>
                    </div>
                    <div class="product-price">16,000원</div>
                </div>
            </div>
        </div>

        <div class="order-btn-area">
            <button class="btn-order" onclick="location.href='recommend.html'" style="background-color: #b5651d; margin-bottom: 10px;">☕ 내게 맞는 원두 추천받기</button>
            <button class="btn-order" onclick="alert('문의하기 서비스 준비중입니다.')">구매 / 문의하기</button>
        </div>

        <footer>
            &copy; 2026 Cupping Note. All rights reserved.
        </footer>
    </div>

    <!-- 슬라이드 자동 전환 스크립트 -->
    <script>
        const track = document.getElementById('sliderTrack');
        const slides = document.querySelectorAll('.slide');
        let currentIndex = 0;

        function moveSlider() {
            currentIndex++;
            if (currentIndex >= slides.length) {
                currentIndex = 0;
            }
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        // 3초마다 자동으로 슬라이드 이동
        setInterval(moveSlider, 3000);
    </script>
</body>
</html>
