<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4단계 원두 취향 진단 - 커핑노트</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .step-container { display: none; }
        .step-container.active { display: block; }
        .option-btn { width: 100%; padding: 14px; margin-bottom: 12px; background: #fff; border: 1px solid #d0c4b4; border-radius: 8px; text-align: left; font-size: 14px; color: #4a3525; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: #f4ede2; border-color: #b5651d; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- 헤더 -->
        <header style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px;">
            <button onclick="location.href='index.html'" style="background: none; border: none; font-size: 15px; cursor: pointer; color: #4a3525; font-weight: 650;">〈 홈으로</button>
            <h1 style="font-size: 16px; margin: 0; color: #4a3525;">COFFEE PRESCRIPTION</h1>
            <div style="width: 50px;"></div>
        </header>

        <div style="padding: 25px 20px;">
            <div style="margin-bottom: 20px;">
                <span id="step-indicator" style="font-size: 12px; font-weight: 700; color: #b5651d; letter-spacing: 1px;">STEP 1 / 4</span>
                <h2 id="step-title" style="font-size: 18px; color: #2c1d11; margin-top: 5px;">원하시는 커피의 산미(상큼한 맛) 취향은 어떠신가요?</h2>
            </div>

            <!-- 4단계 설문 컨테이너 -->
            <div id="quiz-form">
                
                <!-- 1단계: 산미 취향 -->
                <div class="step-container active" data-step="1">
                    <button class="option-btn" onclick="nextStep(1, 'acid', 'low')">1. 산미는 거의 없거나 묵직한 고소함이 좋아요 (과테말라, 콜롬비아)</button>
                    <button class="option-btn" onclick="nextStep(1, 'acid', 'high')">2. 과일처럼 화사하고 상큼한 산미가 좋아요 (에티오피아)</button>
                    <button class="option-btn" onclick="nextStep(1, 'acid', 'any')">3. 특별히 가리지 않고 균형 잡힌 맛이 좋아요</button>
                </div>

                <!-- 2단계: 바디감(묵직함) 취향 -->
                <div class="step-container" data-step="2">
                    <button class="option-btn" onclick="nextStep(2, 'body', 'heavy')">1. 입안을 꽉 채우는 묵직하고 진한 바디감</button>
                    <button class="option-btn" onclick="nextStep(2, 'body', 'clean')">2. 차(Tea)처럼 맑고 깔끔하게 떨어지는 클린컵</button>
                </div>

                <!-- 3단계: 선호하는 향미 노트 -->
                <div class="step-container" data-step="3">
                    <button class="option-btn" onclick="nextStep(3, 'note', 'choco')">1. 다크초콜릿, 카라멜, 견과류의 고소달달함</button>
                    <button class="option-btn" onclick="nextStep(3, 'note', 'floral')">2. 화사한 꽃향기, 베리(달콤한 과일) 향</button>
                    <button class="option-btn" onclick="nextStep(3, 'note', 'cotton')">3. 솜사탕, 열대과일, 바닐라처럼 다채로운 향미 (스페셜 블렌드)</button>
                </div>

                <!-- 4단계: 즐겨 찾는 음용 방식 -->
                <div class="step-container" data-step="4">
                    <button class="option-btn" onclick="finishQuiz('drip')">1. 집이나 사무실에서 간편하게 내려 마시는 '드립백'</button>
                    <button class="option-btn" onclick="finishQuiz('cafe')">2. 카페에서 매장의 전문 추출로 직접 즐기는 '브루잉/블렌드 음료'</button>
                </div>

            </div>

            <!-- 결과 출력 영역 -->
            <div id="result-container" style="display: none; text-align: center; padding: 10px 0;">
                <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
                <h3 style="font-size: 18px; color: #2c1d11; margin-bottom: 5px;">회원님을 위한 맞춤 추천 원두</h3>
                <p style="font-size: 13px; color: #777; margin-bottom: 20px;">설문 결과를 분석하여 가장 알맞은 메뉴를 처방해 드립니다.</p>
                
                <div id="recommend-card" style="background: #fff; border: 1px solid #d0c4b4; border-radius: 12px; padding: 20px; text-align: left; margin-bottom: 20px; cursor: pointer;" onclick="goToDetail()">
                    <!-- 추천 상품 카드 동적 생성 -->
                </div>

                <button class="btn-order" onclick="location.reload()">다시 진단하기</button>
            </div>

        </div>

        <footer>
            &copy; 2026 Cupping Note. All rights reserved.
        </footer>
    </div>

    <script>
        let userAnswers = {};

        function nextStep(current, key, value) {
            userAnswers[key] = value;
            
            document.querySelector(`.step-container[data-step="${current}"]`).classList.remove('active');
            let next = current + 1;
            
            document.querySelector(`.step-container[data-step="${next}"]`).classList.add('active');
            document.getElementById('step-indicator').innerText = `STEP ${next} / 4`;
            
            const titles = {
                2: "입안에서 느껴지는 무게감(바디감)은 어떤 스타일을 선호하시나요?",
                3: "평소 선호하시는 테이스팅 노트(향미)를 선택해 주세요.",
                4: "주로 어떤 형태로 커피를 즐겨 드시나요?"
            };
            document.getElementById('step-title').innerText = titles[next];
        }

        let recommendedItemKey = 'colombia';

        function finishQuiz(method) {
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('step-indicator').style.display = 'none';
            document.getElementById('step-title').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            if (userAnswers.note === 'cotton') {
                recommendedItemKey = 'cottoncandy';
            } else if (userAnswers.acid === 'high' || userAnswers.note === 'floral') {
                recommendedItemKey = 'ethiopia';
            } else if (userAnswers.acid === 'low') {
                recommendedItemKey = 'guatemala';
            } else {
                recommendedItemKey = 'colombia';
            }

            const items = {
                cottoncandy: { name: "이상한 나라의 솜사탕 (Special Blend)", price: "7,000원[cite: 1]", desc: "다채로운 과일 향미와 솜사탕처럼 달콤하게 이어지는 특별한 블렌드[cite: 1]", img: "img/KakaoTalk_20260821_161745910_08.jpg" },
                ethiopia: { name: "에티오피아 (ETHIOPIA)", price: "5,500원[cite: 1]", desc: "화사한 꽃향기와 베리의 달콤함, 홍차 같은 화사한 여운[cite: 1]", img: "img/KakaoTalk_20260821_165741432_01.jpg" },
                guatemala: { name: "과테말라 안티구아", price: "5,500원[cite: 1]", desc: "다크초콜릿의 깊은 풍미와 카라멜의 달콤함, 균형 잡힌 커피[cite: 1]", img: "img/KakaoTalk_20260821_165741432.jpg" },
                colombia: { name: "콜롬비아 (COLOMBIA)", price: "5,500원[cite: 1]", desc: "브라운슈가의 은은한 단맛과 고소함, 깔끔한 시트러스 여운[cite: 1]", img: "img/KakaoTalk_20260821_165741432_02.jpg" }
            };

            const rec = items[recommendedItemKey];
            document.getElementById('recommend-card').innerHTML = `
                <div style="display: flex; gap: 15px; align-items: center;">
                    <img src="${rec.img}" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover;">
                    <div>
                        <div style="font-size: 15px; font-weight: 700; color: #2c1d11; margin-bottom: 4px;">${rec.name}</div>
                        <div style="font-size: 12px; color: #666; margin-bottom: 6px; line-height: 1.4;">${rec.desc}</div>
                        <div style="font-size: 14px; font-weight: 700; color: #b5651d;">${rec.price} (상세보기 〉)</div>
                    </div>
                </div>
            `;
        }

        function goToDetail() {
            location.href = `detail.html?item=${recommendedItemKey}`;
        }
    </script>
</body>
</html>
